# Development stack (Vite dev server, source bind mounts, demo data).
# For the production-like stack see docker-compose.prod.yml.
# Host ports bind to 127.0.0.1 unless DEV_BIND_ADDRESS is set (e.g. 0.0.0.0
# to reach the dev server from another device on a trusted network).
services:
  postgres:
    image: postgres:16-alpine
    container_name: dq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dq-network

  # One-shot, idempotent: hands the uploads volume to the backend's
  # unprivileged user (uid/gid 10001, see backend/Dockerfile) and exits.
  # Volumes created by older versions are owned by root, with a top folder
  # of mode 555. Only ownership and permission bits change; no file is
  # moved, rewritten or deleted. Safe to run on every start: on later runs
  # the folder already belongs to 10001 (mode 750), so root needs
  # DAC_READ_SEARCH to traverse it and FOWNER to chmod it. It has no network
  # and exits immediately.
  uploads-permissions:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dq-command-center-v2-backend:latest
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/uploads && chmod 750 /app/uploads"]
    network_mode: none
    volumes:
      - backend_uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_READ_SEARCH
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dq-command-center-v2-backend:latest
    container_name: dq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      uploads-permissions:
        condition: service_completed_successfully
    # Runs as the image's unprivileged "app" user; no capabilities needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
      INIT_ADMIN_NAME: ${INIT_ADMIN_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      LOCKOUT_THRESHOLD: ${LOCKOUT_THRESHOLD}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      APP_NAME: ${APP_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      SECRET_KEY: ${SECRET_KEY}
      DEV_EXPOSE_AUTH_TOKENS: ${DEV_EXPOSE_AUTH_TOKENS:-false}
      SQL_ECHO: ${SQL_ECHO:-false}
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: >
      sh -c "
        set -e &&
        cd /app &&
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Seeding database...' &&
        python -m app.core.seed_secure &&
        echo 'Starting FastAPI server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '172.16.0.0/12,10.0.0.0/8,192.168.0.0/16'
      "
    networks:
      - dq-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: dq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - dq-network

  nginx:
    image: nginx:1.28-alpine
    container_name: dq-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://127.0.0.1/health", "-O", "-"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - dq-network

volumes:
  postgres_data:
  backend_uploads:

networks:
  dq-network:
    driver: bridge
