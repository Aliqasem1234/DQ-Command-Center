# Production gateway: serves the compiled frontend and proxies the API.
# Used by docker-compose.prod.yml (image built from nginx/Dockerfile.prod).
# The development stack uses nginx/nginx.conf, which proxies the Vite dev
# server instead.
worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Per-client limits for the auth endpoints (the backend also limits).
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=forgot_pw:10m rate=3r/m;
    limit_req_status 429;

    # The backend sets its own security headers; nginx sets the canonical
    # ones for the whole site, so drop the backend's copies instead of
    # sending duplicates (e.g. two CSPs, "X-Frame-Options: DENY, DENY").
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Content-Security-Policy;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Uploads are capped at 50 MB by the API; leave room for multipart overhead.
        client_max_body_size 55M;

        include /etc/nginx/security-headers.conf;

        # ---- API ----------------------------------------------------------
        # X-Forwarded-For is overwritten (not appended) with the real peer so
        # a client can't choose the address the backend rate-limits on.
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/register {
            limit_req zone=register burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/forgot-password {
            limit_req zone=forgot_pw burst=2 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend health (includes a database check).
        location = /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
        }

        # API documentation is disabled by the backend in production; don't
        # route these to it, and don't let the SPA fallback answer 200.
        location ~ ^/(docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        # ---- Frontend -----------------------------------------------------
        # Hashed build assets never change, so they can be cached forever.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location /locales/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Client-side routes (/datasets/<id>, /users, ...) all serve the app
        # shell, so refreshing or deep-linking works. index.html itself must
        # be revalidated so a new deploy is picked up.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
