# Included by every location of the production server. nginx drops all
# inherited add_header directives in any block that declares its own, so
# each location that adds a header (e.g. Cache-Control) must include this.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The production bundle has no inline or eval'd scripts. Inline styles are
# still needed (React style props, chart library).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Only meaningful once served over HTTPS (browsers ignore it on plain HTTP).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
